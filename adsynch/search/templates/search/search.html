<style>
.searchBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: #2f3640;
    max-width: 80%; /* Добавляем максимальную ширину в процентах */
    width: 300px; /* Устанавливаем начальную ширину */
    height: 40px;
    border-radius: 40px;
    padding: 10px;
    transition: 0.4s; /* Добавляем плавное переход при изменении размера */
}

.searchBox:hover > .searchInput {
    width: 80%; /* Используем проценты для адаптивной ширины */
    padding: 0 6px;
}

.searchBox:hover > .searchButton {
  background: white;
  color : #2f3640;
}

.searchButton {
    color: white;
    float: right;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #2f3640;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
}

.searchInput {
    border:none;
    background: none;
    outline:none;
    float:left;
    padding: 0;
    color: white;
    font-size: 16px;
    transition: 0.4s;
    line-height: 40px;
    width: 0px;
}

@media screen and (max-width: 620px) {
    .searchBox {
        width: 200px; /* Изменяем начальную ширину на более маленькое значение */
    }

    .searchBox:hover > .searchInput {
        width: 120px; /* Уменьшаем ширину поля ввода для меньших экранов */
        padding: 0 6px;
    }
}

</style>

<form action="{% url 'search_results' %}" method="get">
        <div class="searchBox">

            <input class="searchInput"type="text" name="q" placeholder="Введите запрос..." value="{{ query }}">
              <button type="submit">Искать</button>
        </div>
</form>
